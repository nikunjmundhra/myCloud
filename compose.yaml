services:
  mycloud:
    build: .
    container_name: mycloud-app
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: "dev-secret-key"
      DATABASE_PATH: "/app/data/mycloud.db"
    volumes:
      - mycloud_data:/app/data
      - mycloud_uploads:/app/uploads

volumes:
  mycloud_data:
  mycloud_uploads: