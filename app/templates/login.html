{% extends "base.html" %}

{% block title %} Login {% endblock %}
{% block content %} 
<section class="auth-card">
    <p class="eyebrow">Welcome back</p>
    <h1>Login</h1>
    <p>Sign in to access your personal cloud.</p>
    {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
    <form method="POST" action="{{ url_for('login') }}" class="stacked-form">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <button class="button primary" type="submit">Login</button>
    </form>
    <p class="auth-switch">New to myCloud? <a href="{{ url_for('register') }}">Create an account</a></p>
</section>
{%endblock%}
