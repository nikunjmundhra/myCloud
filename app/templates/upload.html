{% extends "base.html" %}
{% block title %}Upload{% endblock %}

{% block content %}
<section class="content-card">
    <p class="eyebrow">My files</p>
    <h1>Upload a file</h1>
    <p class="intro">Choose a file to add to your personal cloud storage.</p>
    <form method="POST" enctype="multipart/form-data" class="stacked-form upload-form">
        <label for="file">Choose file</label>
        <input id="file" type="file" name="file" required>
        <button class="button primary" type="submit">Upload file</button>
    </form>
</section>
{% endblock %}
