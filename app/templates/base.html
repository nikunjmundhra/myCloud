<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}myCloud{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="{{ url_for('home') }}">myCloud</a>
            <nav class="main-nav" aria-label="Main navigation">
                <a href="{{ url_for('home') }}">Home</a>
                {% if current_username %}
                    <a href="{{ url_for('files') }}">My Files</a>
                    <a href="{{ url_for('upload') }}">Upload</a>
                {% else %}
                    <a href="{{ url_for('login') }}">Login</a>
                    <a href="{{ url_for('register') }}">Register</a>
                {% endif %}
            </nav>
            <div class="account-area">
                <section class="storage-summary" aria-label="Server storage usage">
                    <div class="storage-heading"><span>Storage</span><strong>{{ storage.percent_used }}% used</strong></div>
                    <div class="storage-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ storage.percent_used }}">
                        <span data-storage-percent="{{ storage.percent_used }}"></span>
                    </div>
                    <small>{{ storage.free }} free of {{ storage.total }}</small>
                </section>
                {% if current_username %}
                    <div class="user-menu"><span>Signed in as <strong>{{ current_username }}</strong></span><a href="{{ url_for('logout') }}">Logout</a></div>
                {% endif %}
            </div>
        </div>
    </header>
    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
